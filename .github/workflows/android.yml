name: Build APK

# Upload the project ZIP (no need to extract) OR the plain project files. Both build.
# Put this file at: .github/workflows/android.yml

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If a .zip is in the repo, unzip the newest one and build that. Otherwise build the repo as is.
      - name: Find project (unzips automatically)
        id: find
        shell: bash
        run: |
          set -e
          ROOT=""
          NEWEST=""; BEST=0
          while IFS= read -r z; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ -z "$NEWEST" ] || [ "$t" -ge "$BEST" ]; then NEWEST="$z"; BEST="$t"; fi
          done < <(git ls-files | grep -i '\.zip$' || true)

          if [ -n "$NEWEST" ]; then
            echo "Using zip: $NEWEST"
            rm -rf "$RUNNER_TEMP/proj" && mkdir -p "$RUNNER_TEMP/proj"
            unzip -q -o "$NEWEST" -d "$RUNNER_TEMP/proj"
            S=$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts -not -path '*/__MACOSX/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
            [ -z "$S" ] && { echo "::error::settings.gradle.kts not found inside $NEWEST"; exit 1; }
            ROOT=$(dirname "$S")
          else
            S=$(find . -name settings.gradle.kts -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
            [ -z "$S" ] && { echo "::error::No project found (no zip and no settings.gradle.kts)"; exit 1; }
            ROOT=$(cd "$(dirname "$S")" && pwd)
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # The project has no gradlew, so Gradle is installed here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.root }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: ${{ steps.find.outputs.root }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
